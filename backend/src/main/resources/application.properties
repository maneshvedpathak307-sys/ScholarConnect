# ==========================================
# APPLICATION
# ==========================================

spring.application.name=scholarship-portal
server.port=8080

# Disable Spring Boot startup banner
spring.main.banner-mode=off


# ==========================================
# DATABASE CONFIGURATION
# ==========================================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/scholarship_portal?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=root
spring.datasource.password=root


# ==========================================
# JPA / HIBERNATE
# ==========================================

spring.jpa.hibernate.ddl-auto=update

# Hide Hibernate SQL queries in console
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.jpa.open-in-view=false


# ==========================================
# JWT CONFIGURATION
# ==========================================

app.jwt.secret=${JWT_SECRET:change-this-secret-key-to-a-long-random-secret-at-least-32-characters}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}


# ==========================================
# FILE UPLOAD CONFIGURATION
# ==========================================

app.upload-dir=${UPLOAD_DIR:uploads}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB


# ==========================================
# CORS CONFIGURATION
# ==========================================

app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:3000}


# ==========================================
# ADMIN ACCOUNT CONFIGURATION
# ==========================================

app.admin.email=admin@SC.com
app.admin.password=Admin@123
app.admin.name=Scholarship Admin


# ==========================================
# GMAIL SMTP - PASSWORD RECOVERY
# ==========================================

spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.username=maneshvedpathak2004@gmail.com
spring.mail.password=ghgz kxnd kjpv raam

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000


# ==========================================
# PASSWORD RECOVERY SETTINGS
# ==========================================

app.password-reset.otp-expiry-minutes=5
app.password-reset.resend-cooldown-seconds=60
app.password-reset.max-attempts=5
app.password-reset.captcha-expiry-minutes=3
app.password-reset.token-expiry-minutes=10


# ==========================================
# CONSOLE LOGGING CONFIGURATION
# ==========================================

# Show application startup INFO messages
logging.level.com.scholarship.portal=INFO

# Hide unnecessary framework INFO messages
logging.level.root=WARN
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.com.zaxxer.hikari=WARN
logging.level.org.apache.tomcat=WARN

# Explicitly disable Hibernate SQL and parameter logs
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF